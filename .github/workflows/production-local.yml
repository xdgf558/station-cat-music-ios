name: Production profile local implementation E2E
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  driver-guards:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 scripts/test_native_production_runner.py
  production-simulator:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select pinned stable Xcode and an available simulator
        run: |
          test -d /Applications/Xcode_26.4.1.app
          export DEVELOPER_DIR=/Applications/Xcode_26.4.1.app/Contents/Developer
          echo DEVELOPER_DIR=$DEVELOPER_DIR >> "$GITHUB_ENV"
          xcrun simctl list devices available -j > /tmp/production-simulators.json
          python3 - <<'PY'
          import json,os
          devices=json.load(open('/tmp/production-simulators.json'))['devices']
          available=[row for runtime,rows in sorted(devices.items(),reverse=True) if 'iOS' in runtime for row in rows if row.get('isAvailable') and row['name'].startswith('iPhone')]
          assert available, 'No iPhone simulator installed'
          with open(os.environ['GITHUB_ENV'],'a') as output:output.write('M1_SIMULATOR_ID='+available[0]['udid']+'\n')
          PY
      - name: Finish simulator cold boot before the verification budget
        timeout-minutes: 15
        run: |
          mkdir -p evidence
          xcrun simctl bootstatus "$M1_SIMULATOR_ID" -b > evidence/production-local-initial-bootstatus.log 2>&1
      - name: Read independently reviewed production backend fixture revision
        id: backend
        run: |
          python3 - <<'PY'
          import json,os,re
          manifest=json.load(open('contracts/backend-production-fixture.json'))
          assert re.fullmatch('[0-9a-f]{40}',manifest['commit'])
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:output.write('revision='+manifest['commit']+'\n')
          PY
      - uses: actions/checkout@v4
        with:
          repository: xdgf558/caption-ai-landing-site
          ref: ${{ steps.backend.outputs.revision }}
          path: .backend-production
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned local fixture dependencies
        working-directory: .backend-production
        run: npm ci
      - name: Native services against real worker on proof-protected loopback
        timeout-minutes: 20
        env:
          PRODUCTION_BACKEND_PATH: ${{ github.workspace }}/.backend-production
        run: python3 scripts/verify_native_production.py
      - name: Production optimized Me navigation with all remote services closed
        timeout-minutes: 15
        run: |
          set -euo pipefail
          smoke_data="$RUNNER_TEMP/station-cat-production-me"
          build=(xcodebuild -project StationCatMusic.xcodeproj -scheme StationCatMusicProductionNavigation
            -configuration Production -destination "platform=iOS Simulator,id=$M1_SIMULATOR_ID"
            -derivedDataPath "$smoke_data" -parallel-testing-enabled NO
            -only-testing:StationCatMusicUITests/ProductionNavigationUITests
            CODE_SIGNING_ALLOWED=NO SWIFT_OPTIMIZATION_LEVEL=-O ENABLE_TESTABILITY=NO
            SWIFT_ACTIVE_COMPILATION_CONDITIONS= STATION_ENVIRONMENT=production
            STATION_NATIVE_AUTH_ENABLED=NO STATION_NATIVE_AUTH_ORIGIN=
            STATION_NATIVE_MUSIC_ENABLED=NO STATION_PERSONAL_SYNC_ENABLED=NO
            STATION_PRODUCTION_ACTIVATION_ENABLED=NO STATION_PRODUCTION_ACTIVATION_PROFILE=
            STATION_PUBLIC_RELEASES_ENABLED=NO STATION_PUBLIC_RELEASE_ORIGIN=
            STATION_PUBLIC_APP_LINKS_ENABLED=NO STATION_MUSIC_WEB_ORIGIN=
            STATION_NETEASE_BROWSER_EXPERIMENT_ENABLED=NO STATION_APP_ENTITLEMENTS=)
          "${build[@]}" build-for-testing > evidence/production-me-build.log 2>&1 || {
            tail -n 100 evidence/production-me-build.log
            exit 1
          }
          python3 - "$smoke_data/Build/Products/Production-iphonesimulator/StationCatMusic.app/Info.plist" <<'PY'
          import plistlib,sys
          with open(sys.argv[1],'rb') as source: info=plistlib.load(source)
          assert info['StationEnvironment']=='production'
          assert info.get('StationThirdPartyPlaybackPolicy')=='EXTERNAL_ONLY'
          for key in ('StationNativeAuthEnabled','StationNativeMusicEnabled','StationPersonalSyncEnabled',
                      'StationProductionActivationEnabled','StationPublicReleasesEnabled',
                      'StationPublicAppLinksEnabled','StationNetEaseBrowserExperimentEnabled'):
              assert info.get(key)=='NO', key
          for key in ('StationNativeAuthOrigin','StationProductionActivationProfile',
                      'StationPublicReleaseOrigin','StationMusicWebOrigin'):
              assert info.get(key)=='', key
          assert 'UIBackgroundModes' not in info
          print('Production optimized UI smoke: remote service flags and origins are closed')
          PY
          "${build[@]}" -resultBundlePath evidence/production-me-smoke.xcresult test-without-building \
            > evidence/production-me-test.log 2>&1 || {
            tail -n 100 evidence/production-me-test.log
            exit 1
          }
          xcrun xcresulttool get test-results summary --path evidence/production-me-smoke.xcresult \
            > evidence/production-me-summary.json
          python3 - <<'PY'
          import json
          with open('evidence/production-me-summary.json') as source: result=json.load(source)
          assert result['totalTestCount']==1 and result['passedTests']==1, result
          assert result['failedTests']==0 and result['skippedTests']==0, result
          print('Production Me navigation smoke passed: 1 test, 0 failures, 0 skips')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-local-implementation-evidence
          path: |
            evidence/production-local-initial-bootstatus.log
            evidence/production-local-build.log
            evidence/production-local-boot.log
            evidence/production-local-bootstatus.log
            evidence/production-local-integration.log
            evidence/production-local-service.log
            evidence/production-local-readiness.log
            evidence/production-local-runtime.jsonl
            evidence/production-local-summary.json
            evidence/production-me-build.log
            evidence/production-me-test.log
            evidence/production-me-summary.json
            evidence/production-me-smoke.xcresult
